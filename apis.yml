name: Clarity Money
description: 'Clarity Money was a personal-finance and money-management mobile app founded in 2016
  by Adam Dell (Oath Holdings / Dell family) that used data-driven analysis to help consumers track
  spending, cancel unwanted subscriptions, negotiate bills, move savings, and manage budgets. It was
  acquired by Goldman Sachs in 2018 and folded into the Marcus by Goldman Sachs consumer platform; the
  standalone Clarity Money app was subsequently discontinued. The company was surfaced as a portfolio
  company of Bessemer Venture Partners and added to the API Evangelist network as an enrichment lead.
  No public developer program, API, documentation, or developer portal was ever published, and the
  claritymoney.com domain no longer resolves to a live site (held by Goldman Sachs registrar CSC).'
